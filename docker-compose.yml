services:
  # PostgreSQL with pgvector extension for vector similarity search
  db:
    image: pgvector/pgvector:pg16
    container_name: finagent_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finagent}
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finagent} -d ${POSTGRES_DB:-finagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    name: finagent_pgdata
