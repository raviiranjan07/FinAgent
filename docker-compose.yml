services:
  # PostgreSQL with pgvector extension for vector similarity search
  db:
    image: pgvector/pgvector:pg16
    container_name: finagent_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finagent}
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finagent} -d ${POSTGRES_DB:-finagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finagent_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: finagent_api
    environment:
      # Database
      DATABASE_ENABLED: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finagent}
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent_secret}
      # LLM Configuration (pass from host .env)
      LLM_MODE: ${LLM_MODE:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Twitter (optional)
      TWITTER_PUBLISHING_ENABLED: ${TWITTER_PUBLISHING_ENABLED:-false}
      TWITTER_DRY_RUN: ${TWITTER_DRY_RUN:-true}
      # Admin
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - finagent_network

  # React Dashboard (served via Nginx)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: finagent_dashboard
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - finagent_network

volumes:
  pgdata:
    name: finagent_pgdata

networks:
  finagent_network:
    name: finagent_network
    driver: bridge
